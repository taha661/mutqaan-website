<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mutqaan Engineering &amp; Construction</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Design, build and visualise: complete construction, interior design, renovation, drawings, estimation, consultancy, photorealistic renders and 3D walkthroughs.">
<meta property="og:title" content="Mutqaan Engineering &amp; Construction"><meta property="og:description" content="Design · Build · Deliver. Construction, interiors, renovation, drawings, estimation, consultancy and 3D visualisation."><meta property="og:image" content="media/hero.jpg"><meta name="theme-color" content="#0E1B33">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>/* Mutqaan: a considered architecture practice. Ivory paper, navy ink, one gold accent from the logo; real renders and a live 3D model carry the imagery. */
:root{
 --bg:#F6F2E9;--paper:#FBF9F4;--surface:#FFFFFF;--ink:#13233F;--ink-2:#2A3A57;--muted:#5A6479;--line:#DDD5C4;--line-2:#E9E3D6;
 --gold:#8A6A1F;--gold-2:#B8913E;--gold-soft:#EFE5C9;--navy:#13233F;--on-navy:#F6F1E4;--band:#0E1B33;--ok:#2F6B45;--warn:#9A5B12;--err:#A3271C;
 --display:'Newsreader',Georgia,'Times New Roman',serif;--body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
 --gut:max(20px,env(safe-area-inset-left,0px));--gutr:max(20px,env(safe-area-inset-right,0px));--r:2px;--sh:0 1px 2px rgba(19,35,63,.06),0 8px 28px rgba(19,35,63,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1424;--paper:#0E1A2E;--surface:#13223A;--ink:#EEE8DA;--ink-2:#D2CBBB;--muted:#A3ADC2;--line:#26375A;--line-2:#1C2C48;--gold:#D9B45A;--gold-2:#E6C677;--gold-soft:#3A3322;--navy:#D9B45A;--on-navy:#0A1424;--band:#0F2342;--ok:#7CC596;--warn:#E7B062;--err:#FF9C92;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1424;--paper:#0E1A2E;--surface:#13223A;--ink:#EEE8DA;--ink-2:#D2CBBB;--muted:#A3ADC2;--line:#26375A;--line-2:#1C2C48;--gold:#D9B45A;--gold-2:#E6C677;--gold-soft:#3A3322;--navy:#D9B45A;--on-navy:#0A1424;--band:#0F2342;--ok:#7CC596;--warn:#E7B062;--err:#FF9C92;--sh:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.65;margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.w{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
.w-n{max-width:820px}
h1,h2,h3,h4{font-family:var(--display);font-weight:400;line-height:1.04;letter-spacing:-.018em;margin:0;text-wrap:balance}
h1{font-size:clamp(2.7rem,6.2vw,5.4rem)}h2{font-size:clamp(2.05rem,4.3vw,3.5rem)}h3{font-size:clamp(1.35rem,2vw,1.7rem);line-height:1.12}h4{font-size:1.15rem;line-height:1.2}
h1 em,h2 em,h3 em{font-style:italic;color:var(--gold)}
p{margin:0 0 1em;max-width:64ch}
a{color:inherit;text-underline-offset:3px}
img{max-width:100%;display:block}
.eyebrow{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:30px;height:1px;background:currentColor}
.lede{font-size:clamp(1.08rem,1.4vw,1.25rem);color:var(--muted);line-height:1.6}
.muted{color:var(--muted)}.small{font-size:.86rem}.tiny{font-size:.76rem}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
h1:focus,h1:focus-visible{outline:none}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;z-index:99;background:var(--navy);color:var(--on-navy);padding:10px 16px}
.skip:focus{top:calc(10px + env(safe-area-inset-top,0px))}
/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.2) blur(12px);-webkit-backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:22px;min-height:74px}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.mark img{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--line)}
.mark b{font-family:var(--display);font-weight:400;font-size:1.45rem;letter-spacing:.16em;line-height:1;display:block}
.mark small{display:block;font-size:.54rem;letter-spacing:.21em;color:var(--muted);margin-top:5px;text-transform:uppercase}
nav.main{display:flex;gap:4px;align-items:center;margin-left:auto}
nav.main a{text-decoration:none;font-size:.88rem;padding:8px 11px;border-radius:var(--r);position:relative}
nav.main a::after{content:"";position:absolute;left:11px;right:11px;bottom:3px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .3s}
nav.main a:hover::after,nav.main a[aria-current="page"]::after{transform:scaleX(1)}
nav.main a.btn::after{display:none}
nav.main .btn{margin-left:10px;padding:11px 18px}
.menu{display:none;margin-left:auto;background:none;border:1px solid var(--line);padding:9px 15px;cursor:pointer;border-radius:var(--r)}
.adm-pill{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold)!important;padding:5px 10px!important}
@media(max-width:1020px){.menu{display:block}nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;padding:10px var(--gutr) 20px var(--gut)}nav.main[data-open="1"]{display:flex}nav.main a{padding:13px 4px;border-bottom:1px solid var(--line-2);font-size:1rem}nav.main .btn{margin:14px 0 0;text-align:center}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--navy);color:var(--on-navy);padding:15px 26px;text-decoration:none;border:1px solid var(--navy);cursor:pointer;font-weight:600;font-size:.9rem;letter-spacing:.015em;border-radius:var(--r);transition:transform .25s,filter .25s,background .25s,color .25s,border-color .25s;white-space:nowrap}
.btn:hover{filter:brightness(1.12);transform:translateY(-2px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:currentColor}
.btn.ghost:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold-2);border-color:var(--gold-2);color:#13233F}
.btn.sm{padding:9px 15px;font-size:.82rem}
.btn .ar{transition:transform .3s}.btn:hover .ar{transform:translateX(4px)}
.link{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* sections */
section{padding-block:clamp(64px,9vw,128px)}
section+section{border-top:1px solid var(--line)}
.band{background:var(--band);color:#F3EEE2;--ink:#F3EEE2;--ink-2:#DCD5C5;--muted:#AEB8CC;--line:#253A60;--line-2:#1D3052;--gold:#D9B45A;--gold-2:#E3C06A;--navy:#E3C06A;--on-navy:#0E1B33;--surface:#132A4D;--paper:#11264A;--bg:#0E1B33;border-top:0!important}
.band+section{border-top:0}
.band .btn.ghost:hover{color:#0E1B33}
.pagehead{padding-block:clamp(56px,8vw,104px) clamp(40px,6vw,72px)}
.pagehead .lede{max-width:56ch;margin-top:22px}
.crumb{font-size:.82rem;color:var(--muted);margin-bottom:24px;display:flex;gap:8px;flex-wrap:wrap}
.crumb a{text-decoration:none;border-bottom:1px solid var(--line)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,6vw,96px)}
.split.wide{grid-template-columns:.85fr 1.15fr}
.split>*{min-width:0}
@media(max-width:860px){.split,.split.wide{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:28px}
/* hero */
.hero{position:relative;min-height:min(92vh,920px);display:flex;align-items:flex-end;color:#F6F1E4;overflow:hidden;background:#0E1B33;padding:0}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 50%;transform:scale(1.06);animation:heroin 2.4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes heroin{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,18,34,.86) 0%,rgba(9,18,34,.55) 38%,rgba(9,18,34,0) 70%),linear-gradient(0deg,rgba(9,18,34,.75) 0%,rgba(9,18,34,0) 45%)}
.hero .w{position:relative;z-index:2;width:100%;padding-block:clamp(90px,14vh,150px) clamp(48px,8vh,88px)}
.hero h1{font-size:clamp(3rem,7.6vw,6.6rem);max-width:12ch;color:#F6F1E4}
.hero h1 em{color:#E3C06A}
.hero .lede{color:#D5DAE5;max-width:46ch;margin-top:26px}
.hero .eyebrow{color:#E3C06A}
.hero .btn.ghost{color:#F6F1E4}.hero .btn.ghost:hover{background:#F6F1E4;color:#0E1B33;border-color:#F6F1E4}
.hero .btn:not(.ghost){background:#E3C06A;border-color:#E3C06A;color:#0E1B33}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:56px;padding-top:22px;border-top:1px solid rgba(246,241,228,.22);font-size:.84rem;color:#C5CCDA}
.hero-foot a{color:#F6F1E4;text-decoration:none;border-bottom:1px solid rgba(246,241,228,.35)}
.hero-foot .k{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:#E3C06A;margin-right:8px}
.prov{font-size:.72rem;letter-spacing:.06em;color:#AEB8CC}
@media(max-width:700px){.hero{min-height:auto}.hero>img{object-position:72% 50%}.hero::after{background:linear-gradient(0deg,rgba(9,18,34,.92) 0%,rgba(9,18,34,.6) 55%,rgba(9,18,34,.25) 100%)}.hero .w{padding-top:44vh}}
/* intro scope */
.scope-tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.scope-tags a{border:1px solid var(--line);padding:8px 14px;text-decoration:none;font-size:.86rem;border-radius:40px;transition:border-color .2s,background .2s}
.scope-tags a:hover{border-color:var(--gold);background:var(--gold-soft)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);margin-top:40px}
.facts div{padding:20px 20px 0 0}
.facts b{font-family:var(--display);font-weight:400;font-size:2.4rem;display:block;line-height:1;color:var(--gold)}
@media(max-width:600px){.facts{grid-template-columns:1fr}}
/* reveal */
.sld{position:relative;aspect-ratio:16/10;max-width:100%;overflow:hidden;background:var(--paper);border:1px solid var(--line)}
.sld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease}
.sld img.on{opacity:1}
.sld .lbl{position:absolute;left:14px;bottom:14px;background:rgba(14,27,51,.86);color:#F3EEE2;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;padding:6px 11px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:40px;padding:4px;gap:2px;flex-wrap:wrap;background:var(--surface)}
.seg button{border:0;background:transparent;padding:9px 17px;border-radius:40px;cursor:pointer;font-size:.86rem;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.layers dt{font-family:var(--display);font-size:1.3rem;margin-top:22px}
.layers dd{margin:6px 0 0;color:var(--muted)}
/* services index */
.svc-wrap{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;margin-top:48px;align-items:start}
@media(max-width:960px){.svc-wrap{grid-template-columns:1fr}.svc-fig{display:none}}
.svc-list{border-top:1px solid var(--ink)}
.svc-row{display:grid;grid-template-columns:62px 1fr 28px;gap:18px;align-items:baseline;padding:26px 0;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .35s}
.svc-row:hover,.svc-row:focus-visible{padding-left:14px}
.svc-row .n{font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.1rem}
.svc-row h3{font-size:clamp(1.45rem,2.6vw,2.05rem);transition:color .3s}
.svc-row:hover h3{color:var(--gold)}
.svc-row p{margin:8px 0 0;color:var(--muted);font-size:.95rem}
.svc-row .ar{color:var(--gold);transition:transform .3s}.svc-row:hover .ar{transform:translateX(6px)}
.svc-fig{position:sticky;top:110px;aspect-ratio:4/5;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.svc-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s,transform 1.2s}
.svc-fig img.on{opacity:1;transform:scale(1.03)}
.svc-fig .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:5rem;color:var(--gold);opacity:0;transition:opacity .5s}
.svc-fig .ph.on{opacity:1}
.svc-fig figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(0deg,rgba(9,18,34,.8),transparent);color:#F3EEE2;font-size:.78rem}
/* viewer */
.viewer{position:relative;aspect-ratio:16/9;max-width:100%;background:#0E1B33;overflow:hidden;border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none}
@media(max-width:700px){.viewer{aspect-ratio:4/5}}
.viewer canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.viewer .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s}
.viewer.live .poster{opacity:0;pointer-events:none}
.vw-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none;flex-wrap:wrap}
.vw-tag{background:rgba(14,27,51,.82);color:#F3EEE2;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;padding:6px 11px}
.vw-hint{background:rgba(14,27,51,.7);color:#D5DAE5;font-size:.76rem;padding:6px 11px;transition:opacity .5s}
.vw-zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
.vw-zoom button{width:38px;height:38px;border:1px solid rgba(255,255,255,.25);background:rgba(14,27,51,.8);color:#F3EEE2;cursor:pointer;font-size:1.1rem}
.vw-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#F3EEE2;text-align:center;padding:20px}
.viewer.live .vw-load{display:none}
.vw-ctrl{display:grid;grid-template-columns:auto 1fr;gap:14px 22px;align-items:center;margin-top:18px}
.vw-ctrl>span{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.vw-ctrl>div{min-width:0}
@media(max-width:640px){.vw-ctrl{grid-template-columns:1fr;gap:6px}.vw-ctrl>div{margin-bottom:10px}}
.tour{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tour input[type=range]{flex:1;min-width:160px;accent-color:var(--gold-2)}
.stills{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
@media(max-width:700px){.stills{grid-template-columns:1fr}}
.stills figure{margin:0}
.stills img{aspect-ratio:3/2;object-fit:cover;width:100%;border:1px solid var(--line)}
.stills figcaption{font-size:.8rem;color:var(--muted);margin-top:8px}
/* cards */
.pcard{display:flex;flex-direction:column;text-decoration:none;min-width:0}
.pcard .im{aspect-ratio:4/3;overflow:hidden;background:var(--paper);border:1px solid var(--line);position:relative}
.pcard .im img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.pcard:hover .im img{transform:scale(1.05)}
.pcard h3{margin-top:18px;transition:color .3s}.pcard:hover h3{color:var(--gold)}
.pcard p{color:var(--muted);font-size:.94rem;margin:8px 0 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:3px 9px;white-space:nowrap}
.tag.k{border-color:var(--line);color:var(--muted)}
.tag.d{border-color:var(--warn);color:var(--warn)}
.im .tag{position:absolute;top:12px;left:12px;background:rgba(14,27,51,.85);border-color:transparent;color:#F3EEE2}
.card{background:var(--surface);border:1px solid var(--line);padding:26px;min-width:0}
a.card{text-decoration:none;transition:transform .3s,border-color .3s}a.card:hover{transform:translateY(-4px);border-color:var(--gold)}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding:10px 0 10px 26px;border-bottom:1px solid var(--line);position:relative}
ul.tick li::before{content:"";position:absolute;left:0;top:21px;width:13px;height:1px;background:var(--gold)}
ol.steps{list-style:none;padding:0;margin:32px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));border-top:1px solid var(--ink);counter-reset:s}
ol.steps li{padding:22px 22px 22px 0;border-bottom:1px solid var(--line);counter-increment:s}
ol.steps li::before{content:counter(s,decimal-leading-zero);font-family:var(--display);font-style:italic;color:var(--gold);font-size:1.9rem;display:block;line-height:1;margin-bottom:12px}
ol.steps b{display:block;font-family:var(--display);font-weight:400;font-size:1.3rem;margin-bottom:6px}
ol.steps span{color:var(--muted);font-size:.92rem}
details{border-bottom:1px solid var(--line);padding:18px 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:16px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";color:var(--gold);font-size:1.3rem;line-height:1}
details[open] summary::after{content:"–"}
details p{margin:12px 0 0;color:var(--muted)}
.notice{border-left:2px solid var(--gold);padding:6px 0 6px 18px;color:var(--muted);font-size:.93rem;max-width:72ch;margin-block:22px}
.notice.ok{border-color:var(--ok)}.notice.err{border-color:var(--err);color:var(--err)}
/* project page */
.gal{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:40px}
.gal figure{margin:0;grid-column:span 6;min-width:0}
.gal figure:first-child{grid-column:span 12}
.gal img{width:100%;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line)}
.gal figure:first-child img{aspect-ratio:21/10}
.gal figcaption{font-size:.8rem;color:var(--muted);margin-top:8px}
@media(max-width:700px){.gal figure{grid-column:span 12}.gal figure:first-child img{aspect-ratio:16/10}}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0;border-top:1px solid var(--ink);margin-top:36px}
.meta div{padding:16px 16px 16px 0;border-bottom:1px solid var(--line)}
.meta span{display:block;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 36px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:8px 16px;cursor:pointer;border-radius:40px;font-size:.86rem}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.empty{border:1px dashed var(--line);padding:30px;color:var(--muted);background:var(--paper)}
/* materials */
.mat .sw{height:110px;margin:-26px -26px 18px;border-bottom:1px solid var(--line)}
.mat h3{font-size:1.45rem}
.mat .meta2{font-size:.84rem;color:var(--muted);margin:6px 0 14px}
.mat .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.cmpbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--navy);color:var(--on-navy);padding:12px 16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:28px;box-shadow:var(--sh)}

 case 'note':{const t=String(action.text||'').trim().slice(0,800);if(!t)throw err('bad','Empty note');log('Note: '+t);break}
 case 'close':{r.stage='closed';log('Closed'+(action.note?': '+String(action.note).slice(0,300):''));break}
 default:throw err('bad','Unknown action')}
 r.v=rec.v+1;r.updated=now;return r}
return {STAGES,KEYS,GATES,QUAL,fresh,apply,valid}});

 const d=$('#e-del');d.onclick=()=>{if(d.dataset.sure){AD.ed[col].splice(AD.sel,1);AD.sel=0;markDirty();drawContent()}else{d.dataset.sure=1;d.textContent='Press again to delete'}}}
function pickUpload(cb){const i=document.createElement('input');i.type='file';i.accept='image/jpeg,image/png,image/webp';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{toast('Uploading…');cb(await uploadImage(f));toast('Uploaded. Add alt text and a caption.')}catch(e){toast(e.message||'Upload failed.')}};i.click()}
async function uploadImage(f){if(!/^image\/(jpeg|png|webp)$/.test(f.type))throw new Error('Use JPEG, PNG or WebP.');const bmp=await createImageBitmap(f);if(bmp.width*bmp.height>60e6)throw new Error('Image is too large.');const s=Math.min(1,2000/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.84));/* re-encoding strips EXIF/location */
 if(admKind()==='artifact'){const a=ST.cap.assets;if(!a)throw new Error('Uploads need the media permission.');const r=await a.upload(blob,{type:'image/jpeg'});return '/_blob/'+r.id}
 const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});const r=await fetch('/api/admin/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Upload failed');return j.url}
function validateContent(c){const errs=[],slugs=new Set();(c.services||[]).forEach(s=>{if(!/^[a-z0-9-]+$/.test(s.slug||''))errs.push('Service "'+s.name+'": slug must use a-z, 0-9 and hyphens.');if(slugs.has(s.slug))errs.push('Duplicate service slug '+s.slug);slugs.add(s.slug)});
 const ps=new Set();(c.projects||[]).forEach(p=>{if(!/^[a-z0-9-]+$/.test(p.slug||''))errs.push('Project "'+p.title+'": invalid slug.');if(ps.has(p.slug))errs.push('Duplicate project slug '+p.slug);ps.add(p.slug);if(p.pub&&(p.media||[]).length&&!String(p.provenance||'').trim())errs.push('Project "'+p.title+'" cannot be published until media permission and provenance is filled in.');if(p.pub&&(p.media||[]).some(m=>!String(m.alt||'').trim()))errs.push('Project "'+p.title+'": every image needs alt text.');(p.media||[]).forEach(m=>{if(m.src&&!safeSrc(m.src))errs.push('Project "'+p.title+'": image source not allowed: '+m.src)})});
 const ms=new Set();(c.materials||[]).forEach(m=>{if(!/^[a-z0-9-]+$/.test(m.id||''))errs.push('Material "'+m.name+'": invalid id.');if(ms.has(m.id))errs.push('Duplicate material id '+m.id);ms.add(m.id);if(m.pub&&!/^\d{4}-\d{2}-\d{2}$/.test(m.reviewed||''))errs.push('Material "'+m.name+'" needs a review date.')});
 const a=(c.settings||{}).ai||{};if(!(a.maxPhotos>=0&&a.maxPhotos<=3))errs.push('AI photos must be 0 to 3.');if(!(a.directions>=2&&a.directions<=3))errs.push('AI directions must be 2 or 3.');if(!(a.refinements>=0&&a.refinements<=2))errs.push('AI refinements must be 0 to 2.');return errs}
async function publishContent(){const errs=validateContent(AD.ed),el=$('#ad-err');if(errs.length){el.innerHTML=errs.map(esc).join('<br>');return}el.textContent='';const b=$('#ad-pub');b.disabled=true;b.innerHTML='<span class="spin"></span> Publishing';
 const next=clone(AD.ed);next.updated=new Date().toISOString();next.log=(next.log||[]).concat([{at:next.updated,by:admKind()==='api'?'owner (hosted admin)':'owner',what:'Content published'}]).slice(-200);
 try{if(admKind()==='artifact'){await ST.cap.art.publish({'content.json':{content:JSON.stringify(next,null,1),contentType:'application/json'}})}
  else{const r=await fetch('/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(next)});const j=await r.json().catch(()=>({}));if(!r.ok)throw {message:j.error}}
  AD.ed=next;C=clone(next);AD.dirty=false;ST.preview=false;toast('Published. Visitors now see the new content.');drawAdmin()}
 catch(e){b.disabled=false;b.textContent='Publish changes';el.textContent=e.code==='conflict'?'Someone else published first. Reload the page, then repeat your edits.':e.code==='not_writer'||e.code==='not_granted'?'This view cannot publish. Open the artifact as its owner and allow edits.':(e.message||'Publishing failed.')}}
/* ---- media / settings / history ---- */
async function drawMedia(){$('#adp').innerHTML=`<p class="muted small">Upload project photos here. Images are re-encoded to strip location data. Add them to a project in Content, with permission noted in its provenance field before publishing.</p><button class="btn sm" id="md-up">Upload image</button><div id="md-list" class="grid3" style="margin-top:20px"><p class="small muted"><span class="spin"></span> Loading…</p></div>`;
 $('#md-up').onclick=()=>pickUpload(url=>{toast('Uploaded: '+url);drawMedia()});let L=[];
 try{if(admKind()==='artifact'){const r=await ST.cap.assets.list();L=r.assets.filter(a=>/^image\//.test(a.contentType)).map(a=>({url:'/_blob/'+a.id,id:a.id,size:a.sizeBytes}))}else{const j=await fetch('/api/admin/media').then(r=>r.json());L=j.items||[]}}catch(e){}
 $('#md-list').innerHTML=L.length?L.map(m=>`<div class="card" style="padding:12px"><img src="${safeSrc(m.url)}" alt="" style="aspect-ratio:4/3;object-fit:cover;width:100%"><p class="tiny" style="margin:8px 0;overflow-wrap:anywhere">${esc(m.url)}</p><button class="link" data-copy="${esc(m.url)}">Copy address</button></div>`).join(''):'<p class="small muted">No uploaded images yet.</p>'}
function drawSettings(){const s=AD.ed.settings,a=s.ai;$('#adp').innerHTML=`<div class="split"><div><h3>Contact</h3><div class="fld" style="margin-top:14px"><label for="st-ph">Phone (dialling)</label><input type="text" id="st-ph" data-s="phone" value="${esc(s.phone)}"></div><div class="fld"><label for="st-ps">Phone (display)</label><input type="text" id="st-ps" data-s="phoneShow" value="${esc(s.phoneShow)}"></div><div class="fld"><label for="st-pi">Phone (international, for WhatsApp)</label><input type="text" id="st-pi" data-s="phoneIntl" value="${esc(s.phoneIntl)}"></div><div class="fld"><label for="st-em">Email</label><input type="text" id="st-em" data-s="email" value="${esc(s.email)}"></div><label class="check fld"><input type="checkbox" id="st-wa" ${s.whatsapp?'checked':''}> Show WhatsApp links</label></div>
 <div><h3>Project Studio AI limits</h3><label class="check fld" style="margin-top:14px"><input type="checkbox" id="st-ai" ${a.enabled?'checked':''}> AI concept directions enabled</label><div class="fld"><label for="st-mp">Photos per session (0 to 3)</label><input type="number" id="st-mp" min="0" max="3" value="${a.maxPhotos}"></div><div class="fld"><label for="st-dr">Initial directions (2 or 3)</label><input type="number" id="st-dr" min="2" max="3" value="${a.directions}"></div><div class="fld"><label for="st-rf">Refinements (0 to 2)</label><input type="number" id="st-rf" min="0" max="2" value="${a.refinements}"></div>
 <h3 style="margin-top:20px">Future features</h3><label class="check fld" style="margin-top:12px"><input type="checkbox" id="st-vr" ${s.flags.vr?'checked':''}> Advertise 360/VR delivery (only once confirmed)</label></div></div>`;
 $$('[data-s]').forEach(i=>i.oninput=()=>{s[i.dataset.s]=i.value.trim();markDirty()});$('#st-wa').onchange=e=>{s.whatsapp=e.target.checked;markDirty()};$('#st-ai').onchange=e=>{a.enabled=e.target.checked;markDirty()};
 [['st-mp','maxPhotos'],['st-dr','directions'],['st-rf','refinements']].forEach(([id,k])=>$('#'+id).oninput=e=>{a[k]=parseInt(e.target.value,10);markDirty()});$('#st-vr').onchange=e=>{s.flags.vr=e.target.checked;markDirty()}}
function drawHistory(){$('#adp').innerHTML=`<p class="muted small">Every publish is recorded here.${admKind()==='artifact'?' The artifact also keeps each published version, so earlier content can be restored.':''}</p><div class="hist" style="margin-top:16px">${(AD.ed.log||[]).slice().reverse().map(h=>`<div><span class="tiny muted">${esc(String(h.at).replace('T',' ').slice(0,16))} · ${esc(h.by)}</span><br>${esc(h.what)}</div>`).join('')}</div>`}

boot();</script>
